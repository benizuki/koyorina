# Cloud Run に渡す環境変数。
# ここに書いてよいのは「漏れても困らない値」だけ。
# APP_SESSION_SECRET・API キー・パスワードは Secret Manager 経由で渡すこと
# （cloudbuild.yaml の --set-secrets を参照）。
GOOGLE_CLOUD_PROJECT: "__GCP_PROJECT__"
GOOGLE_CLOUD_LOCATION: "__GCP_REGION__"

# Google ログイン（Web クライアント ID。秘密ではない）
GOOGLE_OAUTH_CLIENT_ID: ""

# ブラウザから叩く Origin を完全一致で列挙する。カンマ区切り。
CORS_ALLOWED_ORIGINS: "https://__APP_NAME__.example.com"

# 監査ログ
AUTH_AUDIT_LOG_PATH: "/app/backend/data/auth_audit_logs.jsonl"
AUTH_AUDIT_LOG_MAX_BYTES: "5242880"
AUTH_AUDIT_LOG_BACKUP_COUNT: "5"
