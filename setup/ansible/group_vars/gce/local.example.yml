---
# このファイルを local.yml へコピーし、Terraformの設定・出力に合わせて
# 書き換える。local.yml はGit管理対象外。

forge_gcp_project: example-project-123
forge_domain: koyorina.example.com

# terraform output -raw platform_registry の値。
forge_registry: asia-northeast1-docker.pkg.dev/example-project-123/koyorina
forge_image_root: "{{ forge_registry }}"

# Filestoreを使う場合は、Terraformで enable_filestore = true にしたうえで
# 次のコメントを外す。IPと共有名はTerraformの出力値に置き換える。
# forge_enable_filestore: true
# forge_storage_mode: nfs
# forge_storage_class: koyorina-nfs
# forge_storage_access_mode: ReadWriteMany
# forge_nfs_server: 192.0.2.20
# forge_nfs_share: forge
# forge_node_selector: {workload: koyorina-agent}

# 公開アプリのSQLiteをPD CSIへ置く場合。TerraformでCSI用WIFを適用後に有効化する。
# forge_publication_enabled: true
# forge_publication_data_backend: gce-pd
# forge_publication_data_storage_class: koyorina-published-pd
# forge_publication_data_access_mode: ReadWriteOncePod
# forge_publication_data_size: 10Gi
# forge_publication_pd_csi_wif_audience: '//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/koyorina-pd-csi/providers/k3s-csi'
# forge_publication_pd_csi_service_account: 'koyorina-pd-csi@PROJECT_ID.iam.gserviceaccount.com'
