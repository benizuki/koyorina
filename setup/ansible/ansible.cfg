[defaults]
inventory = inventory/onprem.example.yml
host_key_checking = True
retry_files_enabled = False
# 未定義の変数を使ったら黙って空文字にせず、その場で止める。Ansibleの既定の
# 挙動そのもの（render.pyのload.render()が持っていた「知らない鍵は失敗させる」
# 性質と同じ）なので、ここでは明示しない。
collections_path = ./collections

[privilege_escalation]
become = True
become_method = sudo
