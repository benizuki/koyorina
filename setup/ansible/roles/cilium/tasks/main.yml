---
# forge_cni: cilium のときだけ呼ばれる（cluster.yml参照）。k3s-serverロールが
# --flannel-backend=none --disable-network-policy で内蔵flannelを既に止めて
# いる前提で、CNI本体とHubble(relay/UI)をここで導入する。
#
# kubernetes.core は使わない方針（setup/ansible/README.md参照）に合わせ、
# helmも使わない。contrib/observability/install-cilium-cli.sh と同じく、
# checksumを検証したCilium CLI(cilium install)だけで導入する。

- name: Ciliumが導入済みか確かめる
  ansible.builtin.command: "{{ forge_kubectl }} -n kube-system get configmap cilium-config -o name"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_config_present
  changed_when: false
  failed_when: false

- name: Cilium CLIを導入する
  when: cilium_config_present.rc != 0
  block:
    - name: CLIのアーキテクチャ名を決める
      ansible.builtin.set_fact:
        forge_cilium_cli_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

    - name: 導入済みか確かめる
      ansible.builtin.command: /usr/local/bin/cilium version --client
      register: cilium_cli_installed
      changed_when: false
      failed_when: false

    - name: CLIをダウンロード・検証・展開する
      when: cilium_cli_installed.rc != 0
      block:
        - name: 作業ディレクトリを作る
          ansible.builtin.tempfile:
            state: directory
          register: cilium_cli_tmp

        - name: アーカイブを取得する
          ansible.builtin.get_url:
            url: >-
              https://github.com/cilium/cilium-cli/releases/download/{{ forge_cilium_cli_version }}/cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz
            dest: "{{ cilium_cli_tmp.path }}/cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz"
            mode: "0644"

        - name: checksumファイルを取得する
          ansible.builtin.get_url:
            url: >-
              https://github.com/cilium/cilium-cli/releases/download/{{ forge_cilium_cli_version }}/cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz.sha256sum
            dest: "{{ cilium_cli_tmp.path }}/cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz.sha256sum"
            mode: "0644"

        - name: checksumを検証する
          ansible.builtin.shell: |
            set -eu
            cd "{{ cilium_cli_tmp.path }}"
            sha256sum -c "cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz.sha256sum"
          args:
            executable: /bin/bash
          changed_when: false

        - name: /usr/local/binへ展開する
          ansible.builtin.unarchive:
            src: "{{ cilium_cli_tmp.path }}/cilium-linux-{{ forge_cilium_cli_arch }}.tar.gz"
            dest: /usr/local/bin
            remote_src: true
            mode: "0755"

        - name: 作業ディレクトリを消す
          ansible.builtin.file:
            path: "{{ cilium_cli_tmp.path }}"
            state: absent

- name: 初回導入のAPIサーバーノード情報を取得する
  ansible.builtin.command: >-
    {{ forge_kubectl }} get node
    {{ forge_server_node | default('', true) or hostvars[groups['k3s_servers'][0]]['ansible_hostname'] }} -o json
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cilium_server_node
  changed_when: false

- name: APIサーバーのInternalIPを抽出する
  ansible.builtin.set_fact:
    cilium_api_addresses: "{{ (cilium_server_node.stdout | from_json).status.addresses | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | list }}"

- name: 全ノードから使えるAPI接続先を確認する
  ansible.builtin.assert:
    that:
      - cilium_api_addresses | length > 0
      - not cilium_api_addresses[0].startswith('127.')
      - cilium_api_addresses[0] != '::1'
    fail_msg: Ciliumの初回導入にはserverノードのInternalIPが必要です。

- name: agentが使うAPIサーバの内部IPを設定する
  ansible.builtin.set_fact:
    forge_k3s_api_host: "{{ cilium_api_addresses[0] }}"

- name: CiliumをCNIとして導入する(kube-proxyは残す。Hubble relay/UIを有効化)
  when: cilium_config_present.rc != 0
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/cilium install --version {{ forge_cilium_version }}
      --set kubeProxyReplacement=false
      --set operator.replicas=1
      --set hubble.enabled=true
      --set hubble.relay.enabled=true
      --set hubble.ui.enabled=true
      --set k8sServiceHost={{ forge_k3s_api_host }}
      --set k8sServicePort=6443
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Cilium daemonsetが立ち上がるのを待つ
  ansible.builtin.command: >-
    {{ forge_kubectl }} -n kube-system rollout status daemonset/cilium --timeout=5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Cilium operatorが立ち上がるのを待つ
  ansible.builtin.command: >-
    {{ forge_kubectl }} -n kube-system rollout status deployment/cilium-operator --timeout=5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
