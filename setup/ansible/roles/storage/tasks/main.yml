---
# forge_storage_mode で3通りに分かれる:
#   local-path(既定) ノード固定のRWO。GCEだけディスクのmkfs/mountが要る。
#   nfs              csi-driver-nfsでRWX(Filestoreまたは任意のNFS)を構成する。
#   external         Ceph(CephFS/RBD)等、運用者がすでに用意したStorageClassを
#                     そのまま使う。Ansibleはここでは何もしない
#                     （forge_storage_class/forge_storage_access_modeを
#                     その値に合わせるだけでよい）。

# ── local-path ───────────────────────────────────────────────
# オンプレのk3sはlocal-pathを内蔵していてそのまま使える。GCEだけ、agentの
# 1台目に付いた作業領域ディスクをmkfs/mountする必要がある
# （setup/gcp/terraform/startup/agent.sh が担っていた部分）。
- name: GCEの作業領域ディスクをmkfs/mountする(1台目のagentだけ)
  when:
    - forge_storage_mode == "local-path"
    - forge_target == "gce"
    - inventory_hostname == groups['k3s_agents'][0]
  block:
    - name: ディスクの有無を確かめる
      ansible.builtin.stat:
        path: /dev/disk/by-id/google-persistent-disk-1
      register: workspace_disk

    - name: 未フォーマットなら確かめる
      ansible.builtin.command: blkid /dev/disk/by-id/google-persistent-disk-1
      register: workspace_disk_blkid
      changed_when: false
      failed_when: false
      when: workspace_disk.stat.exists

    - name: ext4でフォーマットする(初回だけ)
      ansible.builtin.command: >
        mkfs.ext4 -m 0 -E lazy_itable_init=0,lazy_journal_init=0,discard
        /dev/disk/by-id/google-persistent-disk-1
      when: workspace_disk.stat.exists and workspace_disk_blkid.rc != 0
      changed_when: true

    - name: マウント先を作る
      ansible.builtin.file:
        path: /srv/forge
        state: directory
        mode: "0755"
      when: workspace_disk.stat.exists

    - name: fstabへ登録してmountする
      ansible.posix.mount:
        path: /srv/forge
        src: /dev/disk/by-id/google-persistent-disk-1
        fstype: ext4
        opts: discard,defaults,nofail
        state: mounted
      when: workspace_disk.stat.exists

# ── nfs: RWX(Filestore/任意のNFS)をcsi-driver-nfsで構成する ────────
# csi-driver-nfs（subdirectory provisioner）を使う。GCP Filestore CSIドライバは
# GKEアドオン前提かつ「PVCごとにFilestoreインスタンスを動的作成」というモデルに
# なり、2GiBの利用者PVCごとに1TiB切るような費用になるため使わない。
# csi-driver-nfsなら1つのFilestore（または任意のNFSサーバ）をサブディレクトリで
# 分割でき、オンプレのNFSにもGCEのFilestoreにも同じロールが使える。
#
# 既にCeph(Rook-Ceph等)でRWXなStorageClassを用意している場合は、これを使わず
# forge_storage_mode: external を選ぶ（下記）。
- name: RWX(NFS/Filestore)を構成する(k3sサーバで一度だけ)
  when:
    - forge_storage_mode == "nfs"
    - inventory_hostname == groups['k3s_servers'][0]
  block:
    - name: forge_nfs_serverが指定されていることを確かめる
      ansible.builtin.assert:
        that: forge_nfs_server | length > 0
        fail_msg: >-
          forge_storage_mode=nfs には forge_nfs_server が要ります
          （GCEならterraformのfilestore_ip出力、オンプレならNFSサーバのIP）。

    # 本番では、デプロイ時にGitHubへ依存しないよう、このURLの内容を
    # setup/ansible/roles/storage/files/ へバージョン固定でベンダーすることを
    # 推奨する（追って対応）。上流の install-driver.sh は `kubectl` を直接
    # 呼ぶため（k3sノードには `k3s kubectl` しか無いことがある）、同じ4ファイルを
    # forge_kubectl で順に適用する（内容は同スクリプトを読んで確認済み）。
    - name: csi-driver-nfsを入れる
      ansible.builtin.command: >-
        {{ forge_kubectl }} apply -f
        https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/{{ forge_csi_driver_nfs_version }}/deploy/{{ item }}
      loop:
        - rbac-csi-nfs.yaml
        - csi-nfs-driverinfo.yaml
        - csi-nfs-controller.yaml
        - csi-nfs-node.yaml
      changed_when: true
      register: csi_install
      until: csi_install is succeeded
      retries: 3
      delay: 5

    - name: StorageClassを作る
      ansible.builtin.copy:
        dest: /tmp/koyorina-nfs-storageclass.yaml
        mode: "0600"
        content: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: koyorina-nfs
          provisioner: nfs.csi.k8s.io
          parameters:
            server: "{{ forge_nfs_server }}"
            share: "/{{ forge_nfs_share }}"
            subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"
            mountPermissions: "0777"
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          mountOptions:
            - nfsvers=3
            - hard
            - noatime
            - nconnect=4
          allowVolumeExpansion: false

    - name: StorageClassを適用する
      ansible.builtin.command: "{{ forge_kubectl }} apply -f /tmp/koyorina-nfs-storageclass.yaml"
      changed_when: true

# ── external: Ceph等、すでに用意されたStorageClassをそのまま使う ─────
# 例: Rook-CephのCephFSでRWXを提供している場合。
#   forge_storage_mode: external
#   forge_storage_class: cephfs
#   forge_storage_access_mode: ReadWriteMany
# Ansibleは何もインストールしない。StorageClassの存在だけ確かめる
# （名前を打ち間違えたまま気づかず進むと、PVCがPendingのまま終わる）。
- name: 指定したStorageClassが存在することを確かめる(external)
  when:
    - forge_storage_mode == "external"
    - inventory_hostname == groups['k3s_servers'][0]
  ansible.builtin.command: "{{ forge_kubectl }} get storageclass {{ forge_storage_class }}"
  changed_when: false
  register: external_storage_class
  failed_when: external_storage_class.rc != 0
