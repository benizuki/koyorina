{{- if and .Values.publication.enabled .Values.publication.internalRegistry.enabled }}
{{- if ne .Values.appRegistryKind "private" }}{{ fail "internalRegistry requires appRegistryKind=private" }}{{ end }}
{{- $storage := .Values.publication.internalRegistry }}
{{- if not (has $storage.accessMode (list "ReadWriteOnce" "ReadWriteMany")) }}{{ fail "Registry accessMode must be ReadWriteOnce or ReadWriteMany" }}{{ end }}
{{- if and (eq $storage.storageClass "local-path") (ne $storage.accessMode "ReadWriteOnce") }}{{ fail "local-path Registry requires ReadWriteOnce" }}{{ end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Name }}-registry
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: {{ .Release.Name }}-registry}
spec:
  accessModes: [{{ $storage.accessMode | quote }}]
  storageClassName: {{ required "Registry storageClass is required" $storage.storageClass | quote }}
  resources: {requests: {storage: {{ .Values.publication.internalRegistry.storageSize }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: {{ .Release.Name }}-registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: registry
          image: registry:3
          env:
            - {name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: /var/lib/registry}
            # 古いビルドのイメージを消すため（公開コントローラーが保持ルールに沿って消す）。
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
            - {name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000"}
            - {name: REGISTRY_HTTP_RELATIVEURLS, value: "true"}
            {{- if not .Values.publication.registryHttp }}
            - {name: REGISTRY_HTTP_TLS_CERTIFICATE, value: /tls/tls.crt}
            - {name: REGISTRY_HTTP_TLS_KEY, value: /tls/tls.key}
            {{- end }}
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: Koyorina}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
          ports: [{containerPort: 5000}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {tcpSocket: {port: 5000}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
            {{- if not .Values.publication.registryHttp }}
            - {name: tls, mountPath: /tls, readOnly: true}
            {{- end }}
            - {name: auth, mountPath: /auth, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: registry-data}}
        {{- if not .Values.publication.registryHttp }}
        - {name: tls, secret: {secretName: {{ .Values.publication.internalRegistry.tlsSecret }}}}
        {{- end }}
        - {name: auth, secret: {secretName: {{ .Values.publication.internalRegistry.authSecret }}}}
---
# 公開コントローラーが、ビルドの無い時間に garbage-collect のJobを走らせる（Registryは止めない）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: publication-controller-gc, namespace: {{ .Release.Name }}-registry}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [registry]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: publication-controller-gc, namespace: {{ .Release.Name }}-registry}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: publication-controller-gc}
subjects: [{kind: ServiceAccount, name: publication-controller, namespace: {{ .Release.Name }}-build}]
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: {{ .Release.Name }}-registry}
spec:
  type: {{ $storage.serviceType }}
  {{- if and (eq .Values.publication.internalRegistry.serviceType "LoadBalancer") .Values.publication.internalRegistry.loadBalancerClass }}
  loadBalancerClass: {{ .Values.publication.internalRegistry.loadBalancerClass | quote }}
  {{- end }}
  {{- if and (eq .Values.publication.internalRegistry.serviceType "LoadBalancer") .Values.publication.internalRegistry.loadBalancerIP }}
  loadBalancerIP: {{ .Values.publication.internalRegistry.loadBalancerIP | quote }}
  {{- end }}
  selector: {app: registry}
  ports:
    - port: {{ if eq $storage.serviceType "NodePort" }}5000{{ else }}{{ $storage.servicePort }}{{ end }}
      targetPort: 5000
      {{- if and (eq $storage.serviceType "NodePort") }}
      nodePort: {{ .Values.publication.internalRegistry.nodePort }}
      {{- end }}
{{- end }}
