apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: "${APP_NAME}"
spec:
  clusterIP: None
  selector: {app: "${APP_NAME}-postgres"}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: "${APP_NAME}"
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: "${APP_NAME}-postgres"}
  template:
    metadata:
      labels: {app: "${APP_NAME}-postgres"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/password}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 30
          startupProbe:
            exec: {command: [pg_isready, -U, postgres]}
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: admin-password, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: admin-password
          secret:
            secretName: postgres-admin
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "${STORAGE_CLASS}"
        resources:
          requests: {storage: 10Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: "${APP_NAME}"
spec:
  podSelector:
    matchLabels: {app: "${APP_NAME}-postgres"}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: "${APP_NAME}"}
        - podSelector:
            matchLabels:
              "${DOMAIN}/postgres-client": "true"
      ports:
        - {protocol: TCP, port: 5432}
