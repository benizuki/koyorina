[project]
name = "koyorina"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.156.4,<1", "uvicorn[standard]>=0.54.0,<1",
  "sqlalchemy>=2.1.5,<3", "psycopg[binary]>=3.3.6,<4", "alembic>=1.20.0,<2",
  "pydantic-settings>=2.16.1,<3", "google-auth>=2.62.0,<3",
  "requests>=2.34.2,<3", "itsdangerous>=2.2.0,<3", "email-validator>=2.3.0,<3",
  "google-genai>=2.32.0,<3", "openai>=3.35.1,<4", "httpx>=0.28.1,<1",
  # Kubernetesのexecはストリーム。httpxでは話せないので直接使う。
  "websockets>=16.0,<17",
  # テナントに登録するAPIキーを暗号化して保存する（Fernet）。google-auth 経由で既に入っている。
  "cryptography>=50.0.2,<51"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28.1,<1"]
# 生成エージェントのイメージにだけ入れる（Antigravity を SDK で動かす試験中の方式）。
# 実行部のバイナリ（約120MB）を含むので、本体のイメージには入れない。版は固定し、上げるときは再検証する。
antigravity = ["google-antigravity==0.1.20"]
# 同じく生成エージェントのイメージにだけ入れる（Claude での生成）。Claude Code の実行部（約200MB）を含む。
claude = ["claude-agent-sdk==0.2.164"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["conventions/*.md", "conventions/scaffold/**/*"]
