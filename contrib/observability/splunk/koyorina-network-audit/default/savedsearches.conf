[Koyorina - policy denial or unknown DNS]
search = index=koyorina_audit (sourcetype=koyorina:hubble OR sourcetype=koyorina:cilium_dns) ('flow.verdict'=DROPPED OR 'flow.drop_reason_desc'=*policy* OR 'flow.l7.dns.query'=*) | eval unknown_dns=if(isnotnull('flow.l7.dns.query') AND NOT match('flow.l7.dns.query', "(^|\\.)(openai\\.com|chatgpt\\.com|googleapis\\.com|flatt\\.tech)\\.?$$"), 1, 0) | where 'flow.verdict'="DROPPED" OR unknown_dns=1
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
enableSched = 1

[Koyorina - metadata or private IP attempt]
search = index=koyorina_audit sourcetype=koyorina:hubble | eval destination_ip='flow.IP.destination' | where cidrmatch("127.0.0.0/8", destination_ip) OR cidrmatch("10.0.0.0/8", destination_ip) OR cidrmatch("172.16.0.0/12", destination_ip) OR cidrmatch("192.168.0.0/16", destination_ip) OR cidrmatch("169.254.0.0/16", destination_ip)
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
enableSched = 1

[Koyorina - Hubble lost event]
search = index=koyorina_audit sourcetype=koyorina:hubble (lost_events=* OR type=LOST)
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
enableSched = 1

[Koyorina - collector queue or export failure]
search = index=koyorina_audit sourcetype=koyorina:collector ("Exporting failed" OR "storage-full" OR "queue is full" OR event=collector.queue.high OR queue_utilization>=0.8)
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
alert_type = number of results
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
enableSched = 1
