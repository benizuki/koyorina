[koyorina:hubble]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
TIME_PREFIX = "time":"
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-provider = case(match(coalesce('flow.l7.http.url','flow.l7.dns.query'),"openai\\.com|chatgpt\\.com"),"codex",match(coalesce('flow.l7.http.url','flow.l7.dns.query'),"googleapis\\.com"),"gemini",match(coalesce('flow.l7.http.url','flow.l7.dns.query'),"(npm|pypi)\\.flatt\\.tech"),"dependency",true(),"unknown")
EXTRACT-tenant_id = k8s:forge-tenant=(?<tenant_id>[0-9a-f-]+)
EXTRACT-user_id = k8s:forge-user=(?<user_id>[0-9a-f-]+)

